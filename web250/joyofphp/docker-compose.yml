
services:
  mysql:
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: verysecret
      MYSQL_DATABASE: Cars
      lower_case_table_names: 1
    volumes:
      - mysql_data:/var/lib/mysql

  joyphp:
    build: ./joyphp
    volumes:
      - ./joyphp/src:/var/www/html
    ports:
      - "80:80"
    depends_on:
      - mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "8080:80"
    depends_on:
      - mysql

volumes:
  mysql_data:

    

  

